<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
</head>
<body>
    <center>
    <header>
        <h1>Sign Up</h1>
    </header>

    <main>
        
        <input type="text" id="fullName" placeholder="Full Name" /><br><br>
        
        <input type="email" id="email" placeholder="Email Address" /><br><br>
        
        <input type="password" id="password" placeholder="Password" /><br><br>
        
        <input type="password" id="confirmPassword" placeholder="Confirm Password" /><br><br>

        
        <button type="submit"
            style="background-color: blue; color: white; padding: 10px 20px; border: none; border-radius: 5px;">
            Sign Up
        </button>
        </centercenter>
    </main>
    
</body>
</html>
