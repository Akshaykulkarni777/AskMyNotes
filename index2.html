<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AskMyNotes</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#0f172a;
min-height:100vh;
display:flex;
flex-direction:column;
align-items:center;
padding:50px 20px;
font-family:Arial,Helvetica,sans-serif;
color:#f8fafc;
}

.container{
width:100%;
max-width:800px;
background:#1e293b;
padding:35px;
border-radius:20px;
border:1px solid #334155;
box-shadow:0 15px 40px rgba(0,0,0,0.5);
}

.header{
text-align:center;
margin-bottom:40px;
}

.header h1{
font-size:42px;
color:#f8fafc;
margin-bottom:10px;
}

.header p{
color:#cbd5e1;
}

.section{
margin-bottom:35px;
}

label{
display:block;
margin-bottom:10px;
color:#cbd5e1;
font-weight:bold;
}

input[type="file"]{
width:100%;
padding:12px;
background:#334155;
color:#cbd5e1;
border:1px solid  #475569;
border-radius:10px;
}

#upload-status{
margin-top:8px;
font-size:13px;
color:#94a3b8;
}

textarea{
width:100%;
height:120px;
padding:15px;
background:#1f2937;
color:white;
border:1px solid #475569;
border-radius:10px;
font-size:15px;
resize:none;
outline:none;
}

textarea::placeholder{
color:#64748b;
}

textarea:focus{
border-color:#ec4899;
}

.button-row{
display:flex;
justify-content:space-between;
align-items:center;
margin-top:15px;
}

#status{
color:#94a3b8;
font-size:13px;
}

#ask-btn{
background:#8b5cf6;
color:white;
padding:12px 30px;
border:none;
border-radius:10px;
font-size:15px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

#ask-btn:hover{
background:#7c3aed;
}

#meta{
display:flex;
gap:10px;
margin-top:10px;
}



details{
margin-top:20px;
color:#94a3b8;
}




</style>

</head>

<body>

<div class="container">

<div class="header">
<h1>AskMyNotes</h1>
<p>Chat with your PDF notes using AI-powered retrieval.</p>
</div>

<div class="section">

<label>Upload your notes (PDF)</label>

<input type="file" accept=".pdf">

<div id="upload-status">
No file uploaded yet.
</div>

</div>


<div class="section">

<label>Your question</label>

<textarea placeholder="What do my notes say about..."></textarea>

<div class="button-row">

<div id="status"></div>

<button id="ask-btn">
Submit
</button>

</div>

</div>


<div class="section">

<label>Answer</label>

<div id="meta">

</div>


<div id="answer">
Your answer will appear here...
</div>


<details>


<ol>
<li>Your uploaded PDF notes</li>
<li>Relevant document sections</li>
</ol>

</details>

</div>

</div>


</body>
</html>
